
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Portafolio | Sergio Andrés Cadena Bautista</title>
  <meta name="description" content="Portafolio profesional de Sergio Andrés Cadena Bautista: EdTech, Moodle, diseño instruccional, STEAM y desarrollo frontend.">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #10131c;
      color: #f4f5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 80% 20%, #263b5c 0, transparent 45%),

    }

    main {
      width: min(720px, 100%);
      padding: clamp(24px, 6vw, 56px);
      border: 1px solid #39445a;
      border-radius: 24px;
      background: rgb(20 25 38 / 88%);
      box-shadow: 0 24px 80px #0005;
    }

    .tag {
      color: #83e5cf;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .8rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    p {
      color: #c2cad9;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid #426e67;
      border-radius: 999px;
      color: #a6f0dd;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">EdTech · Learning Technology · Frontend</span>
    <h1>Sergio Andrés Cadena Bautista</h1>
    <p>
      Magíster en Ambientes Educativos Mediados por TIC,
      profesional de la tecnología educativa y administrador Moodle,
      con experiencia en innovación pedagógica y desarrollo de
      soluciones digitales.
    </p>
    <span class="status">● Portafolio en construcción</span>
  </main>
</body>
</html>
